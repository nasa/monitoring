version: '3.8'

services:

  position_reporter:
    container_name: position_reporter
    hostname: cmsa.position_reporter.localutm
    image: interuss/monitoring
    command: position_reporter/start.sh
    environment:
      - POS_REP_AUTH_SPEC=DummyOAuth(http://oauth.authority.localutm:8085/token,uss1)
      - POS_REP_BASE_URL=http://cmsa.position_reporter.localutm # not used
      - POS_REP_PORT=80
    expose:
      - 80
    ports:
      - 8097:80
    volumes:
      - ./output/position_report_logs:/app/monitoring/position_reporter/output/position_report_logs
    user: "${UID_GID}"
    restart: always
    networks:
      - interop_ecosystem_network
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  interop_ecosystem_network:
    external: true
